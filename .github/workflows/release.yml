name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - name: Require tag to match committed manifest and lockfile
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          m = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1']))
          assert os.environ['GITHUB_REF_NAME'] == 'v' + m['packages'][0]['version']
          PY
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: bash tools/check-architecture.sh
      - run: python3 scripts/test-release.py
      - run: cargo package --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - if: runner.os == 'macOS'
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test and package native binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          binary="target/$TARGET/release/edgelord"
          "$binary" --version
          "$binary" strategies list
          "$binary" check config --config config.toml.example
          tar czf "edgelord-$TARGET.tar.gz" -C "target/$TARGET/release" edgelord
          shasum -a 256 "edgelord-$TARGET.tar.gz" > "edgelord-$TARGET.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: edgelord-${{ matrix.target }}
          path: edgelord-*.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - name: Publish crate (errors fail the release)
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - name: Generate formula from verified release artifacts
        run: python3 scripts/update-formula.py "${GITHUB_REF_NAME#v}" artifacts artifacts/edgelord.rb
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/edgelord-*.tar.gz*
            artifacts/edgelord.rb
          fail_on_unmatched_files: true
      - name: Prepare tap update branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git fetch origin main
          git switch -c "homebrew/$GITHUB_REF_NAME" origin/main
          cp artifacts/edgelord.rb Formula/edgelord.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/edgelord.rb
          git commit -m "Homebrew: $GITHUB_REF_NAME"
          git push origin "homebrew/$GITHUB_REF_NAME"
          echo "Merge homebrew/$GITHUB_REF_NAME into main to update the tap." >> "$GITHUB_STEP_SUMMARY"
